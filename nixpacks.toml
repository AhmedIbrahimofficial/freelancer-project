[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo", "php84Extensions.pdo_mysql", "php84Extensions.mbstring", "php84Extensions.bcmath", "php84Extensions.gd", "php84Extensions.curl", "php84Extensions.zip", "php84Extensions.intl", "php84Extensions.exif", "php84Extensions.fileinfo", "php84Extensions.xml", "php84Extensions.tokenizer", "php84Extensions.sqlite3", "composer"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=ext-imagick",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[phases.build]
cmds = [
  "php artisan migrate --force"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
