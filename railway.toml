[build]
buildCommand = "composer install --no-dev --optimize-autoloader --no-interaction --no-scripts --ignore-platform-req=ext-exif --ignore-platform-req=ext-imagick --ignore-platform-req=php && php artisan package:discover --ansi && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force"

[deploy]
startCommand = "php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/up"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
