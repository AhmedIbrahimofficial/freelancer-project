name: Update composer.lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo, pdo_sqlite, sqlite3, dom, curl, json, zip, gd, exif, fileinfo, intl
          coverage: none

      - name: Run composer update
        run: composer update --prefer-dist --no-interaction --no-progress --prefer-stable --no-scripts

      - name: Commit and push composer.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git diff --cached --quiet || git commit -m "chore: update composer.lock for PHP 8.3 compatibility"
          git push origin HEAD:main
